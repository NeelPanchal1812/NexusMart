{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6 col-md-8">

    <div class="card border-0 rounded-4 shadow-lg p-4 p-md-5" style="background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border) !important;">

      <div class="d-flex align-items-center justify-content-between mb-4 border-bottom pb-3" style="border-color: var(--card-border) !important;">
        <div class="d-flex align-items-center gap-3">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4" style="width: 56px; height: 56px;">
            {{ request.user.username|first|upper }}
          </div>
          <div>
            <h3 class="fw-extrabold mb-0" style="letter-spacing: -0.5px;">My Account Profile</h3>
            <span class="text-muted fs-7">Manage your personal contact details & shipping defaults</span>
          </div>
        </div>

        <button onclick="window.history.length > 1 ? history.back() : window.location.href='/'" class="btn btn-glass-outline btn-sm px-3 py-1.5 rounded-pill fw-semibold">
          <i class="fa-solid fa-arrow-left me-1"></i> Back
        </button>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold fs-7"><i class="fa-solid fa-envelope me-1 text-primary"></i> Email Address</label>
          <input type="email" class="form-control form-control-lg rounded-3 fs-6" value="{{ request.user.email }}" disabled style="opacity: 0.7;">
          <small class="text-muted fs-7">Primary email cannot be changed</small>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold fs-7"><i class="fa-solid fa-user me-1 text-primary"></i> Full Name</label>
          <input type="text" name="full_name" class="form-control form-control-lg rounded-3 fs-6" value="{{ profile.full_name }}" placeholder="Enter full name">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold fs-7"><i class="fa-solid fa-phone me-1 text-primary"></i> Mobile Phone</label>
          <input type="tel" name="phone" value="{{ profile.phone }}" class="form-control form-control-lg rounded-3 fs-6" pattern="[6-9]{1}[0-9]{9}" maxlength="10" placeholder="10-digit mobile number" required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold fs-7"><i class="fa-solid fa-location-dot me-1 text-primary"></i> Default Address</label>
          <textarea name="address" class="form-control rounded-3 fs-6" rows="3" placeholder="Enter default delivery address">{{ profile.address }}</textarea>
        </div>

        <button class="btn btn-gradient-primary btn-lg w-100 py-3 fs-6 fw-bold">
          Save Changes <i class="fa-solid fa-check ms-2"></i>
        </button>

      </form>

    </div>

  </div>
</div>

{% endblock %}
