{% extends "base.html" %}
{% block content %}

<div class="row justify-content-center my-4">
  <div class="col-lg-5 col-md-7">

    <div class="card border-0 rounded-4 shadow-lg p-4 p-md-5" style="background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid var(--card-border) !important;">
      
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="fw-extrabold mb-1" style="letter-spacing: -0.5px;">Welcome Back</h3>
        <p class="text-muted fs-7">Sign in to your NEXUS MART account</p>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label fw-semibold fs-7"><i class="fa-solid fa-envelope me-1 text-primary"></i> Email Address</label>
          <input type="email" name="email" class="form-control form-control-lg rounded-3 fs-6" placeholder="name@example.com" required>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold fs-7"><i class="fa-solid fa-key me-1 text-primary"></i> Password</label>
          <input type="password" name="password" class="form-control form-control-lg rounded-3 fs-6" placeholder="••••••••" required>
        </div>

        <button class="btn btn-gradient-primary btn-lg w-100 py-3 fs-6 fw-bold mb-3">
          Sign In <i class="fa-solid fa-right-to-bracket ms-2"></i>
        </button>

        <div class="text-center text-muted fs-7">
          Don't have an account? <a href="/register/" class="text-primary fw-bold text-decoration-none">Register here</a>
        </div>

      </form>

    </div>

  </div>
</div>

{% endblock %}
